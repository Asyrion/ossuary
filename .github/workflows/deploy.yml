name: Test and deploy to GitHub Pages

# a push to main runs the fast browser suite, a pull request the full one in shards; the full suite also runs nightly
# on main (nightly.yml). Other branches are tested by their pull request, so a push there doesn't run everything twice
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # typecheck, unit tests and the build; on main this is all the deploy waits for, since the pull request's run already
  # tested the merge itself in the browser
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # lint and format over the whole code; beside the build, and the deploy does not wait for it
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npm run lint:install
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint

  # the browser tests tagged @fast (npm run test:fast), on a push to main: a quick watch on what goes live, beside the
  # build
  e2e-fast:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Fast browser tests
        run: npm run test:fast
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-fast
          path: test-results/

  # the whole browser suite in three shards side by side, on a pull request (and a run started by hand); the deploy never
  # waits for it
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests (shard ${{ matrix.shard }} of 3)
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/

  deploy:
    # only main goes live: a run started by hand on another branch tests it without deploying it
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
