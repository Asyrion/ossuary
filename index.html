<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ossuary</title>
<link rel="icon" href="data:,"><!-- (no icon yet: keeps the browser from asking for /favicon.ico, a 404) -->
</head>
<body>
<canvas id="game" aria-label="Game view"></canvas>
<div id="vision"></div>
<div id="vignette"></div>
<div id="hurt"></div><div id="dim"></div><div id="chill"></div><div id="stone"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="halfclip"><rect x="0" y="0" width="12" height="24"/></clipPath></defs></svg>
<div id="hud">
  <div id="hearts" aria-label="Health"></div>
  <div id="mana" role="meter" aria-valuemin="0"><i></i></div>
  <div id="insight" role="meter" aria-valuemin="0"><i></i></div>
  <div id="afflict" role="status" aria-live="polite"></div>
  <div id="spells"><div class="slot" id="slot0"></div><div class="slot" id="slot1"></div><div id="level" aria-hidden="true"></div></div>
  <div id="belt" aria-label="Potion belt"></div>
  <div id="items"></div>
  <div id="purse" role="status"></div>
  <div id="vigilHud" role="status"></div>
  <canvas id="minimap" width="300" height="220"></canvas>
  <div id="bossbar"><div id="bossname"></div><div class="track"><div class="fill"></div></div></div>
  <div id="banner"><div class="t"></div><div class="s"></div></div>
  <aside id="pagePanel" class="invDetail pagePanel" aria-live="polite"></aside>
  <aside id="warePanel" class="invDetail pagePanel warePanel" aria-live="polite"></aside>
  <div id="lore" role="status" aria-live="polite">
    <div id="loreIcon"></div>
    <div class="tx"><div id="loreName"></div><div id="loreKind"></div><div id="loreEffect"></div><p id="loreText"></p></div>
  </div>
  <button id="pauseBtn" aria-label="Pause">II</button>
  <!-- play-test aid: how to open the dev menu (remove with STR.dev.hint and its style when the tests are done) -->
  <div id="devHint" data-s="dev.hint"></div>
  <div id="fpsInfo" hidden></div>
</div>
<div id="sticks"><div class="stick" id="stickL"><i></i></div><div class="stick" id="stickR"><i></i></div></div>

<!-- Text comes from src/strings.ts via data-s keys. -->
<div class="screen" id="scrTitle">
  <div class="card">
    <h1 data-s="title.heading"></h1>
    <p class="place" data-s="title.place"></p>
    <p data-s="title.intro"></p>
    <div class="controls" role="table" aria-label="Controls">
      <span></span><span class="h" data-s="controls.keyboard"></span><span class="h" data-s="controls.gamepad"></span><span class="h" data-s="controls.touch"></span>
      <span class="h" data-s="controls.move"></span><span class="k" data-s="controls.moveKeys"></span><span data-s="controls.movePad"></span><span data-s="controls.moveTouch"></span>
      <span class="h" data-s="controls.shoot"></span><span class="k" data-s="controls.shootKeys"></span><span data-s="controls.shootPad"></span><span data-s="controls.shootTouch"></span>
      <span class="h" data-s="controls.spells"></span><span class="k" data-s="controls.spellsKeys"></span><span data-s="controls.spellsPad"></span><span data-s="controls.spellsTouch"></span>
      <span class="h" data-s="controls.glyph"></span><span class="k" data-s="controls.glyphKeys"></span><span data-s="controls.glyphPad"></span><span data-s="controls.glyphTouch"></span>
      <span class="h" data-s="controls.begin"></span><span class="k" data-s="controls.beginKeys"></span><span data-s="controls.beginPad"></span><span data-s="controls.beginTouch"></span>
      <span class="h" data-s="controls.pause"></span><span class="k" data-s="controls.pauseKeys"></span><span data-s="controls.pausePad"></span><span data-s="controls.pauseTouch"></span>
      <span class="h" data-s="controls.inventory"></span><span class="k" data-s="controls.inventoryKeys"></span><span data-s="controls.inventoryPad"></span><span data-s="controls.inventoryTouch"></span>
      <span class="h" data-s="controls.blink"></span><span class="k" data-s="controls.blinkKeys"></span><span data-s="controls.blinkPad"></span><span data-s="controls.blinkTouch"></span>
      <span class="h" data-s="controls.potion"></span><span class="k" data-s="controls.potionHotkeys"></span><span data-s="controls.potionPad"></span><span data-s="controls.potionTouch"></span>
      <!-- play-test aid, like #devHint: remove with it when the tests are done -->
      <span class="h" data-s="controls.dev"></span><span class="k" data-s="controls.devKeys"></span><span data-s="controls.devPad"></span><span data-s="controls.devTouch"></span>
    </div>
    <div class="btns"><button class="act primary" id="btnStart" data-s="title.start"></button></div>
    <p class="small" data-s="title.note"></p>
  </div>
</div>

<div class="screen hidden" id="scrPause">
  <div class="card">
    <h2 data-s="pause.heading"></h2>
    <div class="btns">
      <button class="act primary" id="btnResume" data-s="pause.resume"></button>
      <button class="act" id="btnInv" data-s="pause.inventory"></button>
      <button class="act" id="btnRestart" data-s="pause.restart"></button>
      <button class="act" id="btnLoad" data-s="pause.load"></button>
      <button class="act" id="btnSound" data-s="pause.soundOn"></button>
      <button class="act" id="btnSaveOut" data-s="pause.saveOut"></button>
      <button class="act" id="btnSaveIn" data-s="pause.saveIn"></button>
    </div>
    <div class="vols">
      <label for="volMaster" data-s="pause.master"></label><input type="range" id="volMaster" min="0" max="100" step="5">
      <label for="volEffects" data-s="pause.effects"></label><input type="range" id="volEffects" min="0" max="100" step="5">
      <label for="volInterface" data-s="pause.interface"></label><input type="range" id="volInterface" min="0" max="100" step="5">
      <label for="volMusic" data-s="pause.music"></label><input type="range" id="volMusic" min="0" max="100" step="5">
      <label for="volAmbience" data-s="pause.ambience"></label><input type="range" id="volAmbience" min="0" max="100" step="5">
    </div>
    <p class="small" id="runInfo"></p>
    <p class="small" id="heroInfo"></p>
    <input type="file" id="fileIn" accept=".glb,model/gltf-binary" hidden>
    <input type="file" id="saveFile" accept=".json,application/json" hidden>
  </div>
</div>

<div class="screen hidden" id="scrInv">
  <div class="card inv" role="dialog" aria-labelledby="invTitle">
    <div class="invHead"><h2 id="invTitle" data-s="inv.title"></h2><div class="invTabs" id="invTabs" role="tablist"></div></div>
    <div class="invBody">
      <div class="invList" id="invList" role="listbox" aria-labelledby="invTitle"></div>
      <aside class="invDetail" id="invDetail" aria-live="polite"></aside>
    </div>
    <p class="small invHint" data-s="inv.hint"></p>
  </div>
</div>

<div class="screen hidden" id="scrLab">
  <div class="card inv" role="dialog" aria-labelledby="labTitle">
    <div class="invHead"><h2 id="labTitle" data-s="lab.title"></h2><div class="invTabs" id="labTabs" role="tablist"></div></div>
    <div class="invBody">
      <div class="invList" id="labList" role="listbox" aria-labelledby="labTitle"></div>
      <aside class="invDetail" id="labDetail" aria-live="polite"></aside>
    </div>
    <p class="small invHint" data-s="lab.hint"></p>
  </div>
</div>

<div class="screen hidden" id="scrStone">
  <div class="card inv" role="dialog" aria-labelledby="stoneTitle">
    <div class="invHead"><h2 id="stoneTitle" data-s="waystone.title"></h2><div class="invTabs" id="stoneTabs" role="tablist"></div></div>
    <div class="invBody">
      <div class="invList" id="stoneList" role="listbox" aria-labelledby="stoneTitle"></div>
      <aside class="invDetail" id="stoneDetail" aria-live="polite"></aside>
    </div>
    <p class="small invHint" data-s="waystone.hint"></p>
  </div>
</div>

<div class="screen hidden" id="scrLectern">
  <div class="card inv" role="dialog" aria-labelledby="lecternTitle">
    <div class="invHead"><h2 id="lecternTitle" data-s="vigil.lectern.title"></h2></div>
    <div class="invBody">
      <div class="invList" id="lecternList" role="listbox" aria-labelledby="lecternTitle"></div>
      <aside class="invDetail" id="lecternDetail" aria-live="polite"></aside>
    </div>
    <p class="small invHint" data-s="vigil.lectern.hint"></p>
  </div>
</div>

<div class="screen hidden talk" id="scrTalk">
  <div class="card talkBox" role="dialog" aria-labelledby="talkName">
    <img id="talkIcon" alt="">
    <div class="talkText">
      <h3 id="talkName"></h3>
      <p id="talkLine" aria-live="polite"></p>
      <ol id="talkChoices"></ol>
      <p class="small" data-s="town.hint"></p>
    </div>
  </div>
</div>

<div class="screen hidden" id="scrLevel">
  <div class="card lvUp" role="dialog" aria-labelledby="lvTitle">
    <h2 id="lvTitle"></h2><p class="place" id="lvSub"></p>
    <div class="lvCards" id="lvCards" role="listbox" aria-labelledby="lvTitle"></div>
    <p class="small" id="lvHint" data-s="levels.hint"></p>
  </div>
</div>

<div class="screen hidden" id="scrEnd">
  <div class="card">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <dl class="summary">
      <dt data-s="end.floor"></dt><dd id="endFloor"></dd>
      <dt data-s="end.level"></dt><dd id="endLevel"></dd>
      <dt data-s="end.time"></dt><dd id="endTime"></dd>
      <dt data-s="end.kills"></dt><dd id="endKills"></dd>
      <dt data-s="end.obols"></dt><dd id="endObols"></dd>
      <dt data-s="end.seed"></dt><dd id="endSeed" class="seed"></dd>
      <dt data-s="end.artifacts"></dt><dd><ul id="endItems" class="carried"></ul></dd>
    </dl>
    <div id="endHome" class="home" hidden></div>
    <div class="btns">
      <button class="act primary" id="btnAgain" data-s="end.again"></button>
      <button class="act" id="btnReplay" data-s="end.replay"></button>
    </div>
  </div>
</div>

<div id="rotate" data-s="rotate"></div>
<div id="drop" data-s="drop"></div>
<div id="prompt" role="status" aria-live="polite"></div>
<div id="toast"></div>
<div id="fade"></div>
<div id="dawn"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
